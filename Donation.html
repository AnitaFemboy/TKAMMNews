<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Support Anita Femboy ✦ Scan & Donate</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #e3e8ff;
    }

    .card {
      max-width: 900px;
      width: 100%;
      background: #11162b;
      border-radius: 40px;
      padding: 2.5rem 2rem;
      text-align: center;
      border: 1px solid rgba(130, 140, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .heart-icon {
      font-size: 3rem;
      color: #ff3b6f;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e6dcff, #8f7cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #b8c4ff;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .qr-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 1.5rem 0 2rem;
    }

    .qr-item {
      background: #1a1f38;
      border-radius: 24px;
      padding: 1rem;
      width: 180px;
      border: 1px solid rgba(110, 130, 255, 0.25);
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .qr-item:hover {
      transform: translateY(-5px);
      border-color: #6f8bff;
    }

    .qr-item img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      background: #0e1224;
      transition: opacity 0.2s;
    }

    .qr-item img:hover {
      opacity: 0.85;
    }

    .click-hint {
      font-size: 0.8rem;
      color: #9fa8d0;
      margin-top: 0.6rem;
      letter-spacing: 0.3px;
    }

    .note {
      color: #9fa8d0;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      line-height: 1.6;
    }

    .thankyou {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(130, 150, 255, 0.15);
      font-size: 1.1rem;
      color: #e6ebff;
    }

    .thankyou i {
      color: #ff4070;
      margin: 0 5px;
    }

    /* Lightbox modal */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-image {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(80, 100, 255, 0.3);
      cursor: default;
    }

    .close-lightbox {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 3rem;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 1001;
      background: none;
      border: none;
      line-height: 1;
    }

    .close-lightbox:hover {
      transform: scale(1.2);
      color: #ff6b8a;
    }

    @media (max-width: 600px) {
      .card {
        padding: 1.8rem 1rem;
        border-radius: 28px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .qr-item {
        width: 150px;
        padding: 0.8rem;
      }
      .qr-grid {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart-icon"><i class="fas fa-heart"></i></div>
    <h1>Support Anita Femboy</h1>
    <p class="subtitle">Scan any wallet code below ✨</p>

    <div class="qr-grid" id="qrGrid">
      <!-- Images will be loaded by JavaScript -->
    </div>

    <p class="note">
      <i class="fas fa-camera"></i> Use any crypto wallet app to scan the code.<br />
      Click on an image to view it full size.
    </p>

    <div class="thankyou">
      <i class="fas fa-heart"></i> Thank you for your kindness <i class="fas fa-heart"></i>
    </div>
  </div>

  <!-- Lightbox overlay -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="close-lightbox" id="closeLightbox" aria-label="Close">&times;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="Full size QR code" />
  </div>

  <script>
    (function() {
      const qrGrid = document.getElementById('qrGrid');
      const lightboxOverlay = document.getElementById('lightboxOverlay');
      const lightboxImage = document.getElementById('lightboxImage');
      const closeLightbox = document.getElementById('closeLightbox');

      // Number of images in the pics folder (1.jpg to 10.jpg)
      const imageCount = 10;
      const picsFolder = 'pics/';

      // Generate image items dynamically
      for (let i = 1; i <= imageCount; i++) {
        const imgSrc = `${picsFolder}${i}.jpg`;
        const qrItem = document.createElement('div');
        qrItem.className = 'qr-item';
        qrItem.setAttribute('data-fullsrc', imgSrc);

        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = `Wallet QR code ${i}`;
        img.loading = 'lazy';
        img.onerror = function() {
          // Fallback if image missing: show placeholder
          this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" fill="%231a1f38"/><text x="80" y="85" font-family="sans-serif" font-size="14" fill="%23aab4e0" text-anchor="middle">Image not found</text></svg>';
          this.style.objectFit = 'contain';
          this.style.padding = '10px';
        };

        const hint = document.createElement('div');
        hint.className = 'click-hint';
        hint.innerHTML = '<i class="fas fa-search-plus"></i> Click to view';

        qrItem.appendChild(img);
        qrItem.appendChild(hint);

        // Click to open lightbox with full image
        qrItem.addEventListener('click', function() {
          const fullSrc = this.getAttribute('data-fullsrc');
          lightboxImage.src = fullSrc;
          lightboxOverlay.classList.add('active');
          document.body.style.overflow = 'hidden'; // prevent background scroll
        });

        qrGrid.appendChild(qrItem);
      }

      // Close lightbox
      function closeLightboxFunc() {
        lightboxOverlay.classList.remove('active');
        document.body.style.overflow = '';
        lightboxImage.src = ''; // clear image
      }

      closeLightbox.addEventListener('click', closeLightboxFunc);

      // Close on overlay click (but not on image itself)
      lightboxOverlay.addEventListener('click', function(e) {
        if (e.target === lightboxOverlay) {
          closeLightboxFunc();
        }
      });

      // Close with ESC key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightboxOverlay.classList.contains('active')) {
          closeLightboxFunc();
        }
      });
    })();
  </script>
</body>
</html>
